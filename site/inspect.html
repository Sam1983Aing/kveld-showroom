<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KVELD · Inspect</title>
  <meta name="description" content="Workshop viewer for the seven KVELD models: orbit, zoom to the frets, isolate parts.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 fill=%22%230b0a09%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%229%22 fill=%22none%22 stroke=%22%239fe3f0%22 stroke-width=%221.5%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { background: #0e0d0c; }
    .gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    .gl:active { cursor: grabbing; }
    .ui { position: fixed; inset: 0; pointer-events: none; font: 400 10px/1.5 var(--sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
    .ui > * { pointer-events: auto; }
    .top { position: absolute; left: var(--gutter); top: 24px; right: var(--gutter); display: flex; justify-content: space-between; align-items: baseline; gap: 20px; pointer-events: none; }
    .top a { pointer-events: auto; }
    .mark { font: 500 14px var(--serif); letter-spacing: 0.34em; color: var(--text); text-decoration: none; }
    .mark span { color: var(--accent); margin-left: 0.6em; }
    .stats { text-align: right; }
    .views { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; width: max-content; max-width: calc(100vw - 40px); }
    .ui button { font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--text); padding: 8px 11px; border: 1px solid var(--line); border-radius: 99px; background: rgba(14, 13, 12, 0.6); backdrop-filter: blur(6px); }
    .ui button:hover { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
    .ui button[aria-pressed='true'] { border-color: var(--accent); color: var(--accent); }
    .parts { position: absolute; left: var(--gutter); top: 50%; transform: translateY(-50%); display: grid; gap: 2px; max-height: 70vh; overflow: auto; }
    .parts label { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 3px 0; }
    .parts label:hover { color: var(--text); }
    .parts input { accent-color: var(--accent); margin: 0; }
    .parts .solo { margin-left: auto; opacity: 0.45; font-size: 9px; }
    .parts label:hover .solo { opacity: 1; }
    .parts h3, .modes h3 { margin: 0 0 8px; font: inherit; color: var(--text); }
    .modes { position: absolute; right: var(--gutter); top: 50%; transform: translateY(-50%); display: grid; gap: 6px; justify-items: end; }
    .hint { position: absolute; right: var(--gutter); top: 112px; text-align: right; }
    .guitars { position: absolute; left: 50%; top: 20px; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: calc(100vw - 340px); }
    @media (max-width: 760px) {
      .parts { top: 70px; transform: none; max-height: 34vh; }
      .modes { top: 70px; transform: none; }
      .hint { display: none; }
      .guitars { top: 54px; max-width: calc(100vw - 32px); }
      .parts, .modes { top: 130px; }
      .views { bottom: 14px; }
    }
  </style>
  <script src="vendor/gsap.min.js"></script>
  <script type="importmap">
  { "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
  </script>
  <script type="module" src="src/inspect.js"></script>
</head>
<body>
  <canvas class="gl" aria-label="The guitar model. Drag to orbit, scroll to zoom, right-drag to pan."></canvas>
  <div class="ui">
    <div class="top">
      <a class="mark" href="index.html">KVELD<span>Floe</span></a>
      <p class="stats" data-stats></p>
    </div>
    <nav class="guitars" data-guitars aria-label="Guitars"></nav>
    <div class="parts" data-parts><h3>Parts</h3></div>
    <div class="modes">
      <h3>Look</h3>
      <button type="button" data-light="studio" aria-pressed="true">Studio light</button>
      <button type="button" data-light="room" aria-pressed="false">Showroom light</button>
      <button type="button" data-wire aria-pressed="false">Wireframe</button>
      <button type="button" data-turn aria-pressed="false">Turntable</button>
    </div>
    <nav class="views" data-views aria-label="Camera views"></nav>
    <p class="hint">Drag to orbit · scroll to zoom · right-drag to pan<br>Click a part name to frame it · F frames the whole guitar · 1 to 7 switch guitars</p>
  </div>
</body>
</html>
